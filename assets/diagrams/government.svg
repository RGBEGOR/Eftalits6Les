<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="govTitle govDesc">
<title id="govTitle">Управление государством эфталитов</title><desc id="govDesc">Совет знати выдвигал кандидата из правящей династии. Правителю подчинялись местные династии. Престол не обязательно переходил от отца к сыну.</desc>
<defs><marker id="govArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#a398bf" stroke-width="1.5"/></marker></defs>
<g font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle">
<g class="gov-step"><rect x="170" y="30" width="660" height="140" rx="28" fill="#f1ebfd"/><g fill="#7653d7"><circle cx="258" cy="76" r="13"/><path d="M237 129v-19a21 21 0 0 1 42 0v19Z"/><circle cx="223" cy="91" r="9"/><circle cx="293" cy="91" r="9"/></g><text x="545" y="91" font-size="38" font-weight="700" fill="#11144b">Совет знати</text><text x="545" y="134" font-size="25" fill="#5f5774">династия и придворные вельможи</text></g>
<path d="M500 182V246" stroke="#a398bf" stroke-width="3" fill="none" marker-end="url(#govArrow)"/><text x="691" y="225" font-size="22" fill="#706380">выдвигает кандидата</text>
<g class="gov-step" style="--step-delay:250ms"><rect x="170" y="270" width="660" height="157" rx="28" fill="#fff0be"/><path d="m225 318 15 16 18-26 18 26 15-16-5 50h-56Z" fill="#e5ad28"/><text x="545" y="337" font-size="38" font-weight="700" fill="#11144b">Правитель — шо</text><text x="545" y="382" font-size="25" fill="#756333">представитель правящей династии</text></g>
<path d="M500 442V505" stroke="#a398bf" stroke-width="3" fill="none" marker-end="url(#govArrow)"/><text x="686" y="482" font-size="22" fill="#706380">верховная власть</text>
<g class="gov-step" style="--step-delay:500ms"><rect x="170" y="529" width="660" height="154" rx="28" fill="#e7f6fa"/><path d="M226 641v-60h15v-14h15v14h15v-14h15v74Zm22 0v-27h17v27Z" fill="#25a6c9"/><text x="545" y="594" font-size="35" font-weight="700" fill="#11144b">Местные династии</text><text x="545" y="638" font-size="25" fill="#417382">управляли областями</text></g>
<text x="500" y="735" font-size="24" fill="#71667f">Престол не обязательно переходил от отца к сыну.</text></g></svg>
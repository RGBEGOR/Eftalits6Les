<title id="waterTitle">Орошение полей и садов</title><desc id="waterDesc">От реки отводят канал. Из канала вода поступает на поле и в сад. Орошение помогает получить урожай. Примеры каналов из урока: Зогарык, Бозсу, Даргом.</desc>

<text x="7" y="11" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="4.9389">ЭФТАЛИТЫ</text>
<text x="7" y="17" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.7747">ВЛАСТЬ, ГОРОДА И ТОРГОВЛЯ</text>
<text x="7" y="22.5" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.1750">История Узбекистана  •  7 класс</text>
<text x="7" y="29" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.3514">Имя, класс:</text>
<line x1="31" y1="29.9" x2="108" y2="29.9" stroke="#000" stroke-width="0.18"/>
<text x="7" y="36" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.4572">1  ВРЕМЯ И ТЕРРИТОРИЯ</text>
<line x1="7" y1="37.7" x2="141.5" y2="37.7" stroke="#000" stroke-width="0.22"/>
<text x="7" y="42" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5278">Эфталиты правили в Туране — в Средней Азии.</text>
<text x="7" y="49" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Период:</text>
<line x1="26" y1="50.1" x2="141.5" y2="50.1" stroke="#000" stroke-width="0.15"/>
<text x="26.6" y="49" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="period" data-category="answer" visibility="hidden">V–VI века</text>
<text x="7" y="56" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Два города:</text>
<line x1="34" y1="57.1" x2="141.5" y2="57.1" stroke="#000" stroke-width="0.15"/>
<text x="34.6" y="56" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="cities" data-category="example" visibility="hidden">Бухара, Самарканд</text>
<text x="7" y="63" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.4572">2  УПРАВЛЕНИЕ</text>
<line x1="7" y1="64.7" x2="141.5" y2="64.7" stroke="#000" stroke-width="0.22"/>
<text x="7" y="70" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Монархия —</text>
<line x1="35" y1="71.1" x2="141.5" y2="71.1" stroke="#000" stroke-width="0.15"/>
<text x="35.6" y="70" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="monarchy" data-category="definition" visibility="visible">власть одного правителя</text>
<text x="7" y="77" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Династия —</text>
<line x1="34" y1="78.1" x2="141.5" y2="78.1" stroke="#000" stroke-width="0.15"/>
<text x="34.6" y="77" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="dynasty" data-category="definition" visibility="visible">ряд правителей из одного рода</text>
<text x="7" y="84" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Кандидата на престол выдвигал</text>
<line x1="77" y1="85.1" x2="141.5" y2="85.1" stroke="#000" stroke-width="0.15"/>
<text x="77.6" y="84" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="council" data-category="answer" visibility="hidden">совет знати</text>
<text x="7" y="92" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.4572">3  ВОЙСКО И ВАЖНАЯ ДАТА</text>
<line x1="7" y1="93.7" x2="141.5" y2="93.7" stroke="#000" stroke-width="0.22"/>
<text x="7" y="98" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5278">Государство опиралось на военную силу.</text>
<text x="7" y="105" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">В</text>
<line x1="12" y1="106.1" x2="31" y2="106.1" stroke="#000" stroke-width="0.15"/>
<text x="12.6" y="105" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="year" data-category="answer" visibility="hidden">484</text>
<text x="33" y="105" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.3514">году шах Пероз потерпел поражение и погиб.</text>
<text x="7" y="111" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.3867">Всадники владели верховой ездой и стрельбой из лука.</text>
<text x="7" y="118" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.4572">4  ХОЗЯЙСТВО И ВОДА</text>
<line x1="7" y1="119.7" x2="141.5" y2="119.7" stroke="#000" stroke-width="0.22"/>
<text x="7" y="124" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Ирригация —</text>
<line x1="36" y1="125.1" x2="141.5" y2="125.1" stroke="#000" stroke-width="0.15"/>
<text x="36.6" y="124" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="irrigation" data-category="definition" visibility="visible">искусственное орошение</text>
<text x="7" y="131" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Река →</text>
<line x1="24" y1="132.1" x2="57" y2="132.1" stroke="#000" stroke-width="0.15"/>
<text x="24.6" y="131" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="canal" data-category="answer" visibility="hidden">канал</text>
<text x="59" y="131" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">→ поле →</text>
<line x1="84" y1="132.1" x2="141.5" y2="132.1" stroke="#000" stroke-width="0.15"/>
<text x="84.6" y="131" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="harvest" data-category="answer" visibility="hidden">урожай</text>
<text x="7" y="138" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Один канал:</text>
<line x1="35" y1="139.1" x2="141.5" y2="139.1" stroke="#000" stroke-width="0.15"/>
<text x="35.6" y="138" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="channel" data-category="example" visibility="hidden">Даргом</text>
<text x="7" y="145" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Два ремесла:</text>
<line x1="38" y1="146.1" x2="141.5" y2="146.1" stroke="#000" stroke-width="0.15"/>
<text x="38.6" y="145" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="crafts" data-category="example" visibility="hidden">стеклоделие, гончарство</text>
<text x="7" y="153" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.4572">5  ТОРГОВЛЯ</text>
<line x1="7" y1="154.7" x2="141.5" y2="154.7" stroke="#000" stroke-width="0.22"/>
<text x="7" y="159" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Пошлина —</text>
<line x1="33" y1="160.1" x2="141.5" y2="160.1" stroke="#000" stroke-width="0.15"/>
<text x="33.6" y="159" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="duty" data-category="definition" visibility="visible">плата за провоз товаров</text>
<text x="7" y="166" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Язык международной торговли:</text>
<line x1="78" y1="167.1" x2="141.5" y2="167.1" stroke="#000" stroke-width="0.15"/>
<text x="78.6" y="166" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="language" data-category="answer" visibility="hidden">согдийский</text>
<text x="7" y="173" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.4572">В обращении были серебряные и медные монеты.</text>
<text x="7" y="181" font-family="WorksheetBold,DejaVu Sans,sans-serif" font-size="3.4572">6  ГОРОДА И КУЛЬТУРА</text>
<line x1="7" y1="182.7" x2="141.5" y2="182.7" stroke="#000" stroke-width="0.22"/>
<text x="7" y="187" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.2456">Сосуществовали зороастризм, буддизм и другие верования.</text>
<text x="7" y="194" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">«Город торговцев» —</text>
<line x1="53" y1="195.1" x2="141.5" y2="195.1" stroke="#000" stroke-width="0.15"/>
<text x="53.6" y="194" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="paikend" data-category="answer" visibility="hidden">Пайкенд</text>
<text x="7" y="201" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983">Городам помогали</text>
<line x1="51" y1="202.1" x2="141.5" y2="202.1" stroke="#000" stroke-width="0.15"/>
<text x="51.6" y="201" font-family="WorksheetSans,DejaVu Sans,sans-serif" font-size="3.5983" data-field="conclusion" data-category="answer" visibility="hidden">вода, ремёсла и торговля</text>
